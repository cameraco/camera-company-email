[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # The AIza... string in index.html is a public Firebase Web API key, not a
  # secret - Firebase's security model relies on Firestore/Auth rules, not on
  # hiding this key. Netlify's secrets scanner flags it as a false positive.
  SECRETS_SCAN_OMIT_PATHS = "index.html"
